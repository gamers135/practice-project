<!DOCTYPE html>

<html>

<head>

    <title>UniFind | Verification Failed</title>

    <style>
        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial;

            color: white;

            background:
                radial-gradient(circle at top,
                    #7f1d1d,
                    transparent 40%),
                #120707;

        }

        .box {

            width: 90%;

            max-width: 500px;

            text-align: center;

            padding: 50px 30px;

            border-radius: 30px;

            background:
                rgba(255, 255, 255, 0.05);

            border:
                1px solid rgba(255, 255, 255, 0.1);

        }

        .icon {

            font-size: 70px;

        }

        h1 {

            margin: 20px 0 10px;

        }

        p {

            color: #9ca3af;

            line-height: 1.7;

        }

        a {

            display: inline-block;

            margin-top: 20px;

            padding: 13px 22px;

            border-radius: 12px;

            text-decoration: none;

            color: white;

            background:
                linear-gradient(135deg,
                    #6366f1,
                    #8b5cf6);

        }
    </style>

</head>


<body>

    <div class="box">

        <div class="icon">
            ❌
        </div>

        <h1>
            Verification Failed
        </h1>

        <p>

            The private verification detail does not
            match our records.

        </p>

        <p>

            For security, the item's private details
            are never displayed publicly.

        </p>

        <a href="/matches">
            ← Try Again
        </a>

    </div>

</body>

</html>
